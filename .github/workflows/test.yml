name: Tests

# Runs the test suite on every push to main and every pull request, across
# Linux, macOS, and a real Windows machine. The Windows job is what lets us
# catch Windows-only problems (file paths, %APPDATA%, text encodings) without
# owning a Windows PC.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} • Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel the other machines if one fails — we want to see whether a
      # failure is Windows-only or happens everywhere.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Digr with audio + test dependencies
        run: pip install -e ".[audio,dev]"

      - name: Run the test suite
        run: pytest -q
